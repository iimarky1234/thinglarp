site_name: ThingLarp Documentation
site_url: https://thinglarp.iimarky123.io.vn/docs/
site_description: Learn how to stream, store, and visualize IoT telemetry with ThingLarp
repo_name: iimarky1234/thinglarp
repo_url: https://github.com/iimarky1234/thinglarp
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting_started.md
      - Web Dashboard: dashboard.md
      - Public Link Sharing: public_sharing.md
  - Ingestion:
      - HTTP REST API: sending_data_http.md
      - MQTT Streaming: sending_data_mqtt.md
  - Hardware Integration:
      - ESP32 (Arduino C++): hardware/esp32.md
      - MicroPython: hardware/micropython.md
      - Python Scripting: hardware/python.md
      - Downlink Commands: hardware/commands.md
  - Reference:
      - REST API Reference: reference/api_reference.md
      - MQTT Topics & ACLs: reference/mqtt_topics.md
