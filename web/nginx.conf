server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # Redirect /app to /app/
    location = /app {
        return 301 /app/;
    }

    # Flutter Web SPA mounted at /app/
    location ^~ /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;

        location ~* \.(?:wasm|js|css|json)$ {
            expires 1d;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        location ~* \.(?:png|jpg|jpeg|gif|ico|svg|ttf|otf|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }

    # Static landing page & downloads at root /
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
