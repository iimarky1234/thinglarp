# traefik.yml: Edge reverse proxy with TLS termination

api:
  dashboard: true
  insecure: true # Dashboard available on :8080 (for debugging; restrict in production)

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

  mqtts:
    address: ":8883"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "iot_edge"

certificatesResolvers:
  letsencrypt:
    acme:
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: "web"
