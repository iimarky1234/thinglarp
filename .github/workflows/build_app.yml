name: Build & Package ThingLarp App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================================
  # 1. LINUX BUILD
  # ===========================================================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Linux Release Bundle
        run: |
          cd app
          flutter build linux --release

      - name: Package Linux Bundle
        run: |
          tar -czvf thinglarp-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-linux-x64
          path: thinglarp-linux-x64.tar.gz
          if-no-files-found: error

  # ===========================================================================
  # 2. ANDROID BUILD
  # ===========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Copy & Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk thinglarp-android-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-android-release
          path: thinglarp-android-release.apk
          if-no-files-found: error

  # ===========================================================================
  # 3. WINDOWS BUILD
  # ===========================================================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        shell: pwsh
        run: |
          cd app
          flutter pub get

      - name: Build Windows Release Executable
        shell: pwsh
        run: |
          cd app
          flutter build windows --release

      - name: Package Windows Bundle (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath thinglarp-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-windows-x64
          path: thinglarp-windows-x64.zip
          if-no-files-found: error

  # ===========================================================================
  # 4. WEB BUILD
  # ===========================================================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Web Release
        run: |
          cd app
          flutter build web --release

      - name: Package Web App (TAR.GZ)
        run: |
          tar -czvf thinglarp-web.tar.gz -C app/build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-web
          path: thinglarp-web.tar.gz
          if-no-files-found: error

  # ===========================================================================
  # 5. GITHUB RELEASE (Triggered on git tags like v1.0.0)
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-android, build-windows, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: thinglarp-linux-x64

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: thinglarp-android-release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: thinglarp-windows-x64

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: thinglarp-web

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            thinglarp-linux-x64.tar.gz
            thinglarp-android-release.apk
            thinglarp-windows-x64.zip
            thinglarp-web.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
