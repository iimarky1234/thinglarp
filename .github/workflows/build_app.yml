name: Build & Package ThingLarp App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to upload to (e.g. v1.0.0). Leave blank to only build artifacts without uploading to a release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ===========================================================================
  # 1. LINUX BUILD
  # ===========================================================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Linux Release Bundle
        run: |
          cd app
          flutter build linux --release

      - name: Package Linux Bundle
        run: |
          tar -czvf thinglarp-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .
          (cd app/build/linux/x64/release/bundle && zip -r ../../../../../thinglarp-linux-x64.zip .)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-linux-x64
          path: |
            thinglarp-linux-x64.tar.gz
            thinglarp-linux-x64.zip
          if-no-files-found: error

  # ===========================================================================
  # 2. ANDROID BUILD
  # ===========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Package Android Artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk thinglarp-android-release.apk
          zip thinglarp-android-release.zip thinglarp-android-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-android-release
          path: |
            thinglarp-android-release.apk
            thinglarp-android-release.zip
          if-no-files-found: error

  # ===========================================================================
  # 3. WINDOWS BUILD
  # ===========================================================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        shell: pwsh
        run: |
          cd app
          flutter pub get

      - name: Build Windows Release Executable
        shell: pwsh
        run: |
          cd app
          flutter build windows --release

      - name: Package Windows Bundle (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath thinglarp-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-windows-x64
          path: thinglarp-windows-x64.zip
          if-no-files-found: error

  # ===========================================================================
  # 4. MACOS BUILD
  # ===========================================================================
  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build macOS Release App
        run: |
          cd app
          flutter build macos --release

      - name: Package macOS App (ZIP)
        run: |
          cd app/build/macos/Build/Products/Release
          zip -r -y ../../../../../../thinglarp-macos.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-macos
          path: thinglarp-macos.zip
          if-no-files-found: error

  # ===========================================================================
  # 5. WEB BUILD
  # ===========================================================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Web Release
        run: |
          cd app
          flutter build web --release

      - name: Package Web App
        run: |
          tar -czvf thinglarp-web.tar.gz -C app/build/web .
          (cd app/build/web && zip -r ../../../thinglarp-web.zip .)

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinglarp-web
          path: |
            thinglarp-web.tar.gz
            thinglarp-web.zip
          if-no-files-found: error

  # ===========================================================================
  # 6. GITHUB RELEASE (Triggered on git tags, published release, or manual dispatch)
  # ===========================================================================
  create-release:
    name: Create & Publish GitHub Release
    needs: [build-linux, build-android, build-windows, build-macos, build-web]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          echo "=== Release assets ready for upload ==="
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
