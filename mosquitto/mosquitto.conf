# mosquitto.conf: Eclipse Mosquitto with mosquitto-go-auth plugin

per_listener_settings false

# -----------------------------------------------------------------------------
# Listeners
# -----------------------------------------------------------------------------
# Standard MQTT listener (Internal TCP, routed by Traefik on port 8883)
listener 1883 0.0.0.0

# WebSocket listener (Internal WS, routed by Traefik WSS on port 443 /mqtt)
listener 9001 0.0.0.0
protocol websockets

# -----------------------------------------------------------------------------
# General Settings & Limits
# -----------------------------------------------------------------------------
persistence true
persistence_location /var/lib/mosquitto/

# Log output to stdout for docker logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Protection limits
max_packet_size 65536
max_queued_messages 100000

# Disallow unauthenticated connections
allow_anonymous false

# -----------------------------------------------------------------------------
# Authentication & Authorization Plugin (mosquitto-go-auth)
# -----------------------------------------------------------------------------
auth_plugin /mosquitto/go-auth.so
auth_opt_backends postgres
auth_opt_log_level info

# Password Hasher Configuration
auth_opt_hasher bcrypt
auth_opt_hasher_cost 10

# PostgreSQL Backend Connection
auth_opt_pg_host timescaledb
auth_opt_pg_port 5432
auth_opt_pg_dbname iot
auth_opt_pg_user iot_mqtt_auth
auth_opt_pg_password iot_mqtt_auth_secret
auth_opt_pg_sslmode disable
auth_opt_pg_connect_tries 10

# Queries
auth_opt_pg_userquery SELECT password_hash FROM mqtt.credentials WHERE username = $1 LIMIT 1
auth_opt_pg_superquery SELECT count(*) FROM mqtt.superusers WHERE username = $1
auth_opt_pg_aclquery SELECT mqtt.acl_topics($1, $2)

# In-Memory Cache (Prevents DB saturation on high-frequency publish/subscribe)
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 300
auth_opt_acl_cache_seconds 120
